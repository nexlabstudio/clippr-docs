# Stardust Documentation Configuration
# Full reference: https://stardust.nexlab.studio/config/overview

name: Clippr
description: Deep linking and mobile attribution platform for iOS, Android, and Flutter
tagline: Beautiful deep links, powerful attribution

# Site URL (update for production)
url: https://docs.useclippr.xyz

# Branding
logo:
  light: /icon.svg
  dark: /icon.svg
favicon: /favicon.ico

# Content settings
content:
  dir: docs/

# Top Navigation
nav:
  - label: Docs
    href: /
  - label: SDKs
    href: /sdks
  - label: API Reference
    href: /api
  - label: Dashboard
    href: https://app.useclippr.xyz
    external: true
  - label: GitHub
    href: https://github.com/nexlabstudio/clippr-docs
    external: true

# Sidebar Navigation
sidebar:
  - group: Getting Started
    pages:
      - label: Introduction
        slug: index
      - label: Quick Start
        slug: getting-started/quickstart
      - label: Core Concepts
        slug: getting-started/concepts
      - label: Dashboard Setup
        slug: getting-started/dashboard-setup

  - group: SDKs Overview
    pages:
      - label: Overview
        slug: sdks/index

  - group: Flutter SDK
    collapsed: false
    pages:
      - label: Overview
        slug: sdks/flutter/index
      - label: Installation
        slug: sdks/flutter/installation
      - label: Quick Start
        slug: sdks/flutter/quickstart
      - label: Handling Links
        slug: sdks/flutter/handling-links
      - label: Creating Links
        slug: sdks/flutter/creating-links
      # - label: Event Tracking
      #   slug: sdks/flutter/event-tracking
      - label: API Reference
        slug: sdks/flutter/api-reference

  - group: iOS SDK
    collapsed: false
    pages:
      - label: Overview
        slug: sdks/ios/index
      - label: Installation
        slug: sdks/ios/installation
      - label: Quick Start
        slug: sdks/ios/quickstart
      - label: Universal Links
        slug: sdks/ios/universal-links
      - label: Handling Links
        slug: sdks/ios/handling-links
      - label: Creating Links
        slug: sdks/ios/creating-links
      # - label: Event Tracking
      #   slug: sdks/ios/event-tracking
      - label: API Reference
        slug: sdks/ios/api-reference

  - group: Android SDK
    collapsed: false
    pages:
      - label: Overview
        slug: sdks/android/index
      - label: Installation
        slug: sdks/android/installation
      - label: Quick Start
        slug: sdks/android/quickstart
      - label: App Links
        slug: sdks/android/app-links
      - label: Handling Links
        slug: sdks/android/handling-links
      - label: Creating Links
        slug: sdks/android/creating-links
      # - label: Event Tracking
      #   slug: sdks/android/event-tracking
      - label: API Reference
        slug: sdks/android/api-reference

  - group: Dashboard
    collapsed: true
    pages:
      - label: Overview
        slug: dashboard/index
      - label: Apps
        slug: dashboard/apps
      - label: Links
        slug: dashboard/links
      - label: Analytics
        slug: dashboard/analytics
      - label: Team Management
        slug: dashboard/team
      - label: Billing
        slug: dashboard/billing

  # - group: API Reference
  #   collapsed: true
  #   pages:
  #     - label: Overview
  #       slug: api/index
  #     - label: Authentication
  #       slug: api/authentication
  #   autogenerate:
  #     dir: api/endpoints

  - group: Guides
    collapsed: true
    pages:
      - label: Firebase Migration
        slug: guides/migration
      - label: Deferred Deep Linking
        slug: guides/deferred-linking
      # - label: Attribution
      #   slug: guides/attribution
      - label: Custom Domains
        slug: guides/custom-domains
      # - label: SKAdNetwork
      #   slug: guides/skan

  - group: Resources
    collapsed: true
    pages:
      - label: FAQ
        slug: resources/faq
      - label: Troubleshooting
        slug: resources/troubleshooting
      - label: Changelog
        slug: resources/changelog

# Theme Configuration
theme:
  colors:
    primary: "#6366f1"
  darkMode:
    enabled: true
    default: system
  fonts:
    sans: Inter, system-ui, sans-serif
    mono: JetBrains Mono, monospace

# Code blocks
code:
  theme:
    light: github-light
    dark: github-dark
  copyButton: true

# Search
search:
  enabled: false
  provider: pagefind
  placeholder: Search documentation...
  hotkey: k

# SEO
seo:
  titleTemplate: "%s | Clippr Docs"
  defaultImage: /og-image.png

# Social links
social:
  github: https://github.com/nexlabstudio
  twitter: https://twitter.com/useclippr

# Header
header:
  showName: true

# Footer
footer:
  copyright: "© 2026 Nexlab Studio. All rights reserved."
  links:
    - group: Product
      items:
        - label: Dashboard
          href: https://app.useclippr.xyz
        - label: Pricing
          href: https://useclippr.xyz/pricing
    - group: Resources
      items:
        - label: Documentation
          href: /
        - label: API Reference
          href: /api
    - group: Company
      items:
        - label: GitHub
          href: https://github.com/nexlabstudio
        - label: Twitter
          href: https://twitter.com/useclippr

# Edit links
editLink:
  enabled: true
  pattern: https://github.com/nexlabstudio/clippr-docs/edit/main/docs/{path}
  text: Edit this page on GitHub

# Build
build:
  outDir: dist
  cleanUrls: true
